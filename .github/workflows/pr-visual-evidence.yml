name: PR visual evidence

# For agent-generated PRs: build the extension, run the Playwright e2e suite (which
# loads the built extension and drives a real GitHub PR page), then commit the
# screenshots and embed them in the PR body and flip the PR to ready-for-review.
#
# Gated to the CBA enterprise org + self-hosted runner (needs Portkey reachable to
# generate a quiz during the run). A no-op elsewhere, so it stays green.

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  evidence:
    if: >-
      github.repository == 'CBA-General/PRep' &&
      contains(github.event.pull_request.labels.*.name, 'agent-generated')
    runs-on: default # CBA enterprise self-hosted runner
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR head by SHA (not the attacker-controllable ref name).
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run e2e (captures screenshots)
        env:
          # Extension needs the gateway live to generate a quiz during the run.
          PORTKEY_BASE_URL: ${{ vars.PORTKEY_BASE_URL }}
          PORTKEY_API_KEY: ${{ secrets.PORTKEY_API_KEY }}
          PORTKEY_MODEL: ${{ vars.PORTKEY_MODEL }}
          # GitHub session for viewing the (internal) PR page in the browser.
          GH_AUTH_STATE: ${{ secrets.GH_AUTH_STATE }}
        run: xvfb-run -a bun run e2e

      - name: Commit screenshots to the PR branch
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain e2e/screenshots)" ]; then
            echo "No screenshot changes."; exit 0
          fi
          git config user.name "prep-bot"
          git config user.email "prep-bot@users.noreply.github.com"
          git add e2e/screenshots
          git commit -m "test: add Playwright visual evidence [skip ci]"
          git push origin "HEAD:${PR_HEAD_REF}"

      - name: Embed screenshots in PR body and mark ready
        run: |
          set -euo pipefail
          shopt -s nullglob
          BODY_FILE="$(mktemp)"
          gh pr view "$PR_NUMBER" --json body --jq .body > "$BODY_FILE"
          {
            echo ""
            echo "## Visual evidence"
            echo ""
            for img in e2e/screenshots/*.png; do
              name="$(basename "$img")"
              url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${PR_HEAD_REF}/${img}"
              echo "**${name}**"
              echo ""
              echo "![${name}](${url})"
              echo ""
            done
          } >> "$BODY_FILE"
          gh pr edit "$PR_NUMBER" --body-file "$BODY_FILE"
          gh pr ready "$PR_NUMBER"
