name: Feedback triage

# Fires when a feedback issue is opened. The Claude Code agent triages relevance
# and, if relevant, implements the change and opens a draft PR. Screenshots are
# added by pr-visual-evidence.yml.
#
# Gated to the CBA enterprise org: portkey.aipe.cba is only reachable from a
# self-hosted enterprise runner, so this is a no-op (and stays green) elsewhere.

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  triage:
    # Only run in the enterprise org, and only for feedback issues.
    if: >-
      github.repository == 'CBA-General/PRep' &&
      contains(github.event.issue.labels.*.name, 'feedback')
    # CBA enterprise runner (label `default`). SECURITY: issue title/body are
    # attacker-controlled (any org member can open a feedback issue). Prefer an
    # EPHEMERAL, job-isolated runner whose only egress is the Portkey gateway +
    # the enterprise GitHub API. The narrow tool allow/deny-list below + the
    # "untrusted input" rule in the agent prompt are defence-in-depth, not a
    # substitute for that isolation.
    runs-on: default
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Triage and fix
        # Org mirror of anthropics/claude-code-action (allowlisted in CBA-General).
        # It wraps the Claude Code CLI — the prompt_file + allowedTools below ARE
        # the pipeline; no skills required.
        uses: CBA-General/claude-code-action@1f3b47e8874073280d96d5cc2d209504b14de1a5 # main @ 2026-06-07; review before bumping
        env:
          # Route Claude Code through the CBA Portkey gateway (Bedrock-backed).
          # Confirmed CBA pattern: ANTHROPIC_BASE_URL=https://portkey.aipe.cba
          # (ai-engineering mac-setup.sh). Default the var to that.
          ANTHROPIC_BASE_URL: ${{ vars.PORTKEY_BASE_URL || 'https://portkey.aipe.cba' }}
          ANTHROPIC_CUSTOM_HEADERS: |
            x-portkey-api-key: ${{ secrets.PORTKEY_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.PORTKEY_MODEL }}
          # claude-code-action requires this to be set; the real auth is the
          # Portkey header above.
          ANTHROPIC_API_KEY: ${{ secrets.PORTKEY_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt_file: .github/agents/triage-and-fix.md
          # Least privilege: only the specific commands the agent needs to branch,
          # build, and open a PR — NOT unrestricted Bash. The deny-list blocks the
          # obvious exfiltration / arbitrary-fetch vectors a prompt injection in the
          # issue body would reach for.
          claude_args: >-
            --allowedTools "Bash(git:*) Bash(gh:*) Bash(bun install) Bash(bun run typecheck) Bash(bun run build) Bash(bun run lint) Edit Write Read Glob Grep"
            --disallowedTools "Bash(curl:*) Bash(wget:*) Bash(nc:*) Bash(ssh:*) Bash(scp:*) Bash(eval:*) Bash(env) Bash(printenv) Bash(cat /proc/*)"
