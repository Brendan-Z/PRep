name: Release

# On every push to main (i.e. a merged PR), semantic-release inspects the
# Conventional Commits since the last release, decides the next version, creates
# the git tag + GitHub release, attaches the built+zipped extension, and commits
# the version bump back to main. No manual tagging.
on:
  push:
    branches: [main]

permissions:
  contents: write # create releases, tags, and push the version-bump commit
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # runtime for semantic-release; build still uses bun
      - run: bun install --frozen-lockfile
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
